plugins {
    id 'com.android.application'
}

android {
    namespace 'com.roshbar.pos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.roshbar.pos'
        minSdk 24          // SUNMI V2 / V2s run Android 7.1 or newer
        targetSdk 35
        versionCode 6
        versionName '1.3.2'
        // Default server; can be changed on the sign-in screen.
        buildConfigField 'String', 'DEFAULT_SERVER', '"https://roshbar.com"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // A fixed debug key kept in the repo, so a newer APK installs over the
        // old one without uninstalling (uninstalling would lose offline orders).
        debug {
            storeFile file('shop-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release key comes from GitHub secrets (see README). Without it the
        // release build is not signed and only the debug APK is installable.
        release {
            def ks = System.getenv('RB_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('RB_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RB_KEY_ALIAS')
                keyPassword System.getenv('RB_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('RB_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // SUNMI built-in printer service (Maven Central).
    implementation 'com.sunmi:printerlibrary:1.0.24'
}
