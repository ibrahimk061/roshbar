name: Android app (SUNMI)

on:
  push:
    paths: ['sunmi-app/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['sunmi-app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sunmi-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: roshbar-pos-apk
          path: sunmi-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30
